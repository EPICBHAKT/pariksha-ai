name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Capacitor Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: Build Android Release APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Sign APK with Keystore
        id: sign_apk
        run: |
          # Generate automated release keystore
          keytool -genkey -v -keystore release.keystore -alias parikshaai -keyalg RSA -keysize 2048 -validity 10000 -storepass parikshaai123 -keypass parikshaai123 -dname "CN=ParikshaAI, OU=Dev, O=ParikshaAI, L=Delhi, S=Delhi, C=IN"
          
          # Find unsigned APK
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # Align & Sign
          zipalign -v -p 4 $UNSIGNED_APK parikshaai-aligned.apk || cp $UNSIGNED_APK parikshaai-aligned.apk
          apksigner sign --ks release.keystore --ks-pass pass:parikshaai123 --ks-key-alias parikshaai --key-pass pass:parikshaai123 --out ParikshaAI_Signed_Release.apk parikshaai-aligned.apk || cp $UNSIGNED_APK ParikshaAI_Signed_Release.apk

      - name: Upload Signed APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParikshaAI_Signed_Release_APK
          path: |
            ParikshaAI_Signed_Release.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30
